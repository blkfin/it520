<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="600" viewBox="0 0 1400 600" role="img" aria-labelledby="title"><title id="title">Read 2D in three explicit steps</title><style>text{font-family:system-ui,sans-serif;fill:#172635;font-size:30px}.strong{font-weight:700}.small{font-size:25px}.mono{font-family:ui-monospace,monospace}</style><rect width="1400" height="600" rx="20" fill="#f8fafc"/><text x="40" y="47" class="mono strong">scanner-07  report  2D</text><text x="40" y="103" class="strong">1  Expand the hex notation</text><text x="640" y="103" class="mono">2 → 0010     D → 1101</text><text x="40" y="162" class="strong">2  Separate the fields using the layout</text><text x="297" y="207" class="mono small">7</text><rect x="250" y="220" width="130" height="56" rx="8" fill="#dbe7ff" stroke="#526579" stroke-width="2"/><text x="297" y="260" class="mono strong">0</text><text x="427" y="207" class="mono small">6</text><rect x="380" y="220" width="130" height="56" rx="8" fill="#dbe7ff" stroke="#526579" stroke-width="2"/><text x="427" y="260" class="mono strong">0</text><text x="557" y="207" class="mono small">5</text><rect x="510" y="220" width="130" height="56" rx="8" fill="#dbe7ff" stroke="#526579" stroke-width="2"/><text x="557" y="260" class="mono strong">1</text><text x="687" y="207" class="mono small">4</text><rect x="640" y="220" width="130" height="56" rx="8" fill="#e6e6e6" stroke="#526579" stroke-width="2"/><text x="687" y="260" class="mono strong">0</text><text x="817" y="207" class="mono small">3</text><rect x="770" y="220" width="130" height="56" rx="8" fill="#ffe9c7" stroke="#526579" stroke-width="2"/><text x="817" y="260" class="mono strong">1</text><text x="947" y="207" class="mono small">2</text><rect x="900" y="220" width="130" height="56" rx="8" fill="#ffe9c7" stroke="#526579" stroke-width="2"/><text x="947" y="260" class="mono strong">1</text><text x="1077" y="207" class="mono small">1</text><rect x="1030" y="220" width="130" height="56" rx="8" fill="#ffe9c7" stroke="#526579" stroke-width="2"/><text x="1077" y="260" class="mono strong">0</text><text x="1207" y="207" class="mono small">0</text><rect x="1160" y="220" width="130" height="56" rx="8" fill="#ffe9c7" stroke="#526579" stroke-width="2"/><text x="1207" y="260" class="mono strong">1</text><rect x="250" y="288" width="390" height="52" rx="8" fill="#dbe7ff" stroke="#526579" stroke-width="2"/><text x="265" y="323" class="strong" style="font-size:26px">status: 001</text><rect x="640" y="288" width="130" height="52" rx="8" fill="#e6e6e6" stroke="#526579" stroke-width="2"/><text x="655" y="323" class="strong" style="font-size:26px">spare</text><rect x="770" y="288" width="520" height="52" rx="8" fill="#ffe9c7" stroke="#526579" stroke-width="2"/><text x="785" y="323" class="strong" style="font-size:26px">tote count: 1101</text><text x="40" y="389" class="strong">3  Apply the rule for each field</text><rect x="40" y="412" width="625" height="98" rx="8" fill="#dbe7ff" stroke="#526579" stroke-width="2"/><text x="58" y="449" class="strong">Codebook: 001 → Busy</text><text x="58" y="487" class="small">Status is a label, not an unsigned number.</text><rect x="690" y="412" width="665" height="98" rx="8" fill="#ffe9c7" stroke="#526579" stroke-width="2"/><text x="708" y="449" class="strong">Tote-count weights: 8, 4, 2, 1</text><text x="708" y="487" class="mono" style="font-size:28px">1101 → 8 + 4 + 0 + 1 = 13</text><text x="40" y="565" class="strong">Scanner 7: Busy; 13 items recorded in the current tote.</text></svg>
