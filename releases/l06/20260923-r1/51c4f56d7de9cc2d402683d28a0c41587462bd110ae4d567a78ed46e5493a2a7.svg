<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="555" viewBox="0 0 1400 555" role="img" aria-labelledby="title"><title id="title">Build one byte from status and item count</title><style>text{font-family:system-ui,sans-serif;fill:#172635;font-size:30px}.strong{font-weight:700}.small{font-size:25px}.mono{font-family:ui-monospace,monospace}</style><rect width="1400" height="555" rx="20" fill="#f8fafc"/><text x="40" y="48" class="strong">Two facts: Busy (status) and 13 items recorded in this tote.</text><text x="40" y="100" class="">Busy → codebook → 001</text><text x="735" y="100" class="">Tote total 13 → place value → 1101</text><text x="40" y="158" class="strong">One byte = eight bits. Our layout assigns every bit a job.</text><text x="297" y="211" class="mono">7</text><rect x="250" y="225" width="130" height="64" rx="8" fill="#dbe7ff" stroke="#526579" stroke-width="2"/><text x="297" y="268" class="mono strong">0</text><text x="427" y="211" class="mono">6</text><rect x="380" y="225" width="130" height="64" rx="8" fill="#dbe7ff" stroke="#526579" stroke-width="2"/><text x="427" y="268" class="mono strong">0</text><text x="557" y="211" class="mono">5</text><rect x="510" y="225" width="130" height="64" rx="8" fill="#dbe7ff" stroke="#526579" stroke-width="2"/><text x="557" y="268" class="mono strong">1</text><text x="687" y="211" class="mono">4</text><rect x="640" y="225" width="130" height="64" rx="8" fill="#e6e6e6" stroke="#526579" stroke-width="2"/><text x="687" y="268" class="mono strong">0</text><text x="817" y="211" class="mono">3</text><rect x="770" y="225" width="130" height="64" rx="8" fill="#ffe9c7" stroke="#526579" stroke-width="2"/><text x="817" y="268" class="mono strong">1</text><text x="947" y="211" class="mono">2</text><rect x="900" y="225" width="130" height="64" rx="8" fill="#ffe9c7" stroke="#526579" stroke-width="2"/><text x="947" y="268" class="mono strong">1</text><text x="1077" y="211" class="mono">1</text><rect x="1030" y="225" width="130" height="64" rx="8" fill="#ffe9c7" stroke="#526579" stroke-width="2"/><text x="1077" y="268" class="mono strong">0</text><text x="1207" y="211" class="mono">0</text><rect x="1160" y="225" width="130" height="64" rx="8" fill="#ffe9c7" stroke="#526579" stroke-width="2"/><text x="1207" y="268" class="mono strong">1</text><text x="40" y="211" class="small">position</text><text x="40" y="267" class="small">bit value</text><rect x="250" y="303" width="390" height="58" rx="8" fill="#dbe7ff" stroke="#526579" stroke-width="2"/><text x="265" y="341" class="strong" style="font-size:26px">status: 3 bits</text><rect x="640" y="303" width="130" height="58" rx="8" fill="#e6e6e6" stroke="#526579" stroke-width="2"/><text x="655" y="341" class="strong" style="font-size:26px">spare</text><rect x="770" y="303" width="520" height="58" rx="8" fill="#ffe9c7" stroke="#526579" stroke-width="2"/><text x="785" y="341" class="strong" style="font-size:26px">tote count: 4 bits</text><text x="250" y="409" class="small">Read by codebook</text><text x="647" y="409" class="small">0</text><text x="790" y="409" class="small">Read by weights 8, 4, 2, 1</text><text x="40" y="473" class="strong">3 status bits + 1 spare bit + 4 tote-count bits = 8-bit report</text><text x="40" y="520" class="small">Position labels (7 to 0) locate bits. They are not the count’s place values.</text></svg>
